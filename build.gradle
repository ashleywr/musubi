plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.27'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    // Blockbench support files live under assets/minecraft for editor convenience,
    // but they must not be packaged or loaded by the game runtime.
    exclude("assets/minecraft/**")
    exclude("assets/assets/**")
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenLocal()
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup "top.theillusivec4.curios" }
    }
    maven {
        url "https://maven.blamejared.com"
        content { includeGroup "mezz.jei" }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    data {
        arguments.addAll '--mod', project.mod_id, '--all',
            '--output', file('src/generated/resources/').getAbsolutePath(),
            '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Curios — required: provides the needle equipment slot
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // JEI — optional recipe viewer. APIs compile-only, full jar runtime-only for dev.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Jade — optional tooltip integration. Sourced from modpack runtime.
    compileOnly "maven.modrinth:jade:15.10.5+neoforge"

    // Sophisticated Backpacks — optional integration for auto-thread backpack upgrade.
    // Uncomment once the SB maven coordinate is confirmed.
    // compileOnly "curse.maven:sophisticated-backpacks-422301:${sophback_version}"

    // Local dev jars (spark profiler, etc.) — place in libs/
    fileTree(dir: 'libs', include: '*.jar').each { f -> localRuntime files(f) }

    // AutoMine testing framework
    localRuntime files('C:/WorkDir/AutoMineTesting/build/libs/automine_testing-neoforge-1.21.1-0.1.0.jar')

    // Unit tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    testImplementation 'org.assertj:assertj-core:3.24.1'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    systemProperty 'project.dir', projectDir.absolutePath
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava').configure {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Werror'])
}

tasks.register('checkBbmodels', Exec) {
    group = 'verification'
    description = 'Scans Blockbench .bbmodel files for suspicious coplanar faces.'
    workingDir = projectDir
    commandLine 'python', 'tools/check_bbmodel_coplanar_faces.py'
}

tasks.register('checkBbmodelsSeams', Exec) {
    group = 'verification'
    description = 'Scans Blockbench .bbmodel files for all shared-plane seams.'
    workingDir = projectDir
    commandLine 'python', 'tools/check_bbmodel_coplanar_faces.py', '--seams'
    ignoreExitValue = true
}

tasks.register('syncBbmodelSupportAssets', Exec) {
    group = 'maintenance'
    description = 'Syncs vanilla Blockbench support parents and textures into the workspace.'
    workingDir = projectDir
    commandLine 'python', 'tools/sync_blockbench_support_assets.py'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

ext.synesthesiaLocalModKey = 'musubi'
def synesthesiaSyncScript = file('C:/WorkDir/synesthesia/tools/synesthesia-sync.gradle')
if (synesthesiaSyncScript.exists()) {
    apply from: synesthesiaSyncScript
}
